name: Lint
description: Run flutter analyze and pre-commit hooks

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.x'
        channel: stable
        cache: true
    - run: flutter pub get
      shell: bash
    - run: flutter analyze
      shell: bash
    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - uses: pre-commit/action@v3.0.1
      # generate-icons and generate-store-graphics rasterize SVGs via
      # Inkscape, which is not installed on the runner; the rendered images are
      # committed and the hooks guard drift locally, so skip them in CI.  The
      # store images' formats are still checked by the test suite.
      env:
        SKIP: generate-icons,generate-store-graphics
