name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test

  deploy-web:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set BUILD_METADATA
        run: |
          build_timestamp=$(date -u +'%Y%m%d-%H%M%S')
          description=$(git describe --long)
          echo "BUILD_METADATA=${build_timestamp}-${description}" >> $GITHUB_ENV
      - run: >-
          flutter build web
          --base-href /unitary/
          --dart-define=BUILD_METADATA='${{ env.BUILD_METADATA }}'
          --release
          --wasm
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git --work-tree build/web add --all
      - shell: bash
        run: |
          git commit -m "Automatic deployment of $(git describe)"
      - run: git push origin HEAD:gh-pages --force

  # The release chain below (prepare -> build-* -> release) is gated to push
  # events only, matching what the separate Release workflow used to trigger
  # on. Skipping `prepare` skips everything downstream via `needs:`, so this
  # one condition covers the whole chain. Without it, every pull request
  # would build an APK and a web bundle nobody looks at — and `prepare`'s
  # `git describe` would be describing a PR merge ref.
  prepare:
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    outputs:
      build_metadata: ${{ steps.vars.outputs.build_metadata }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: vars
        run: |
          build_timestamp=$(date -u +'%Y%m%d-%H%M%S')
          description=$(git describe --long)
          echo "build_metadata=${build_timestamp}-${description}" >> $GITHUB_OUTPUT
          echo "version=$(git describe | sed 's/^v//')" >> $GITHUB_OUTPUT

  build-android-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        run: >-
          flutter build apk
          --dart-define=BUILD_METADATA='${{ needs.prepare.outputs.build_metadata }}'
          --release
      - name: Prepare Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk unitary-${{ needs.prepare.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: unitary-${{ needs.prepare.outputs.version }}.apk

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >-
          flutter build web
          --dart-define=BUILD_METADATA='${{ needs.prepare.outputs.build_metadata }}'
          --release
          --wasm
      - name: Prepare web build
        run: zip -r unitary-${{ needs.prepare.outputs.version }}-web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: unitary-${{ needs.prepare.outputs.version }}-web.zip

  release:
    needs: [prepare, build-android-apk, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: web-zip
      - name: Read release notes
        run: >-
          git tag -l --format="%(contents:body)" ${{ github.ref_name }} | tee RELEASE_NOTES.md
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ${{ github.ref_name }}
          --notes-file RELEASE_NOTES.md
          --title "Release ${{ needs.prepare.outputs.version }}"
          unitary-${{ needs.prepare.outputs.version }}.apk
          unitary-${{ needs.prepare.outputs.version }}-web.zip
