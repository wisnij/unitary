name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test

  deploy-web:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set BUILD_METADATA
        run: |
          build_timestamp=$(date -u +'%Y%m%d-%H%M%S')
          description=$(git describe --long)
          echo "BUILD_METADATA=${build_timestamp}-${description}" >> $GITHUB_ENV
      - run: >-
          flutter build web
          --base-href /unitary/
          --dart-define=BUILD_METADATA='${{ env.BUILD_METADATA }}'
          --release
          --wasm
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git --work-tree build/web add --all
      - shell: bash
        run: |
          git commit -m "Automatic deployment of $(git describe)"
      - run: git push origin HEAD:gh-pages --force

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      build_metadata: ${{ steps.vars.outputs.build_metadata }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: vars
        run: |
          build_timestamp=$(date -u +'%Y%m%d-%H%M%S')
          description=$(git describe --long)
          echo "build_metadata=${build_timestamp}-${description}" >> $GITHUB_OUTPUT
          echo "version=$(git describe | sed 's/^v//')" >> $GITHUB_OUTPUT

  # Unsigned build, on every push and pull request.  No signing secrets are in
  # reach here: without android/key.properties the release build type falls back
  # to debug signing.  This exists to keep the Android build path exercised
  # before a tag is cut; its artifact is never published.
  build-android-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK (unsigned)
        run: >-
          flutter build apk
          --dart-define=BUILD_METADATA='${{ needs.prepare.outputs.build_metadata }}'
          --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # Signed build, tags only.  The `release` environment carries the signing
  # secrets and is restricted by repository settings to v* tags, so this job
  # cannot run — and the secrets cannot be reached — from a branch or a pull
  # request, whatever the workflow file says.
  build-android-apk-signed:
    if: github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    outputs:
      asset: ${{ steps.asset.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_APP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
        run: |
          set +x
          umask 077
          keystore="${RUNNER_TEMP}/unitary-app.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          # PKCS12 has a single password, so storePassword and keyPassword match.
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > android/key.properties
      - name: Build Android APK (signed)
        run: >-
          flutter build apk
          --dart-define=BUILD_METADATA='${{ needs.prepare.outputs.build_metadata }}'
          --release
      - name: Verify signing certificate
        env:
          EXPECTED: ${{ vars.ANDROID_APP_CERT_SHA256 }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::error::ANDROID_APP_CERT_SHA256 is not set; cannot verify signing"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          actual=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | awk '/certificate SHA-256 digest/ {print $NF}')
          echo "expected: $EXPECTED"
          echo "actual:   $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the expected app signing key"
            exit 1
          fi
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/unitary-app.p12"
      - name: Compute asset name
        id: asset
        run: echo "name=unitary-${{ needs.prepare.outputs.version }}.apk" >> "$GITHUB_OUTPUT"
      - name: Prepare Android APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.asset.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      asset: ${{ steps.asset.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >-
          flutter build web
          --dart-define=BUILD_METADATA='${{ needs.prepare.outputs.build_metadata }}'
          --release
          --wasm
      - name: Compute asset name
        id: asset
        run: echo "name=unitary-${{ needs.prepare.outputs.version }}-web.zip" >> "$GITHUB_OUTPUT"
      - name: Prepare web build
        run: zip -r "${{ steps.asset.outputs.name }}" build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [prepare, build-android-apk-signed, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: web-zip
      - name: Read release notes
        run: >-
          git tag -l --format="%(contents:body)" ${{ github.ref_name }} | tee RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create ${{ github.ref_name }}
          --notes-file RELEASE_NOTES.md
          --title "Release ${{ needs.prepare.outputs.version }}"
          ${{ needs.build-android-apk-signed.outputs.asset }}
          ${{ needs.build-web.outputs.asset }}
