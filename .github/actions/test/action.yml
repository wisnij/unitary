name: Test
description: Run flutter tests with coverage reporting

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.x'
        channel: stable
        cache: true
    - run: flutter pub get
      shell: bash
    - run: flutter test --coverage
      shell: bash
    - name: Run Android integration tests
      # Off by default until proven stable in CI — flip by setting the
      # ENABLE_ANDROID_INTEGRATION_TESTS env var to 'true' on the calling
      # workflow/job (see .github/workflows/ci.yml). All three files in
      # integration_test/ pass repeatedly against a real local Android
      # emulator (verified during implementation); this specific CI
      # configuration hasn't itself been run yet, hence the gate.
      #
      # (A web/Chrome path was tried first and abandoned: it hits a
      # long-standing, currently-unresolved upstream Flutter/DWDS bug —
      # see openspec/changes/integration-tests/design.md. Native Android
      # integration_test doesn't route through DWDS/web-driver at all, so
      # none of that applies here — this is the plain
      # `flutter test -d <device>` command, no separate driver/webdriver
      # server needed.)
      if: ${{ env.ENABLE_ANDROID_INTEGRATION_TESTS == 'true' }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: default
        arch: x86_64
        profile: pixel_6_pro
        script: |
          for f in integration_test/*.dart; do
            flutter test "$f" -d emulator-5554
          done
    - run: dart run cobertura convert --input coverage/lcov.info --output coverage/cobertura.xml
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/cobertura.xml
    - run: dart run cobertura show
      shell: bash
