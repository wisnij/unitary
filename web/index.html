<!DOCTYPE html>
<html>
<head>
  <!--
    No <base> element, on purpose: without one, relative URLs resolve against
    the directory this page was loaded from, so one build works wherever it
    is mounted (/app/ on the project site, any subdirectory when the release
    archive is self-hosted, or a local preview).  This relies on the app's
    default hash URL strategy; with path-based URLs, relative URLs would
    resolve against the route path instead.

    A relative <base href="./"> would behave the same in a release build, but
    the `flutter run` development server rejects any base href that is not
    absolute.  Do not pass --base-href to `flutter build web`: there is no
    placeholder for it to replace.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Unit converter and dimensional analysis calculator.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="unitary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unitary</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
